  <style>
:root {
  --bg: #F7F4EF;
  --surface: #FFFFFF;
  --surface2: #F0EBE3;
  --text: #1C1917;
  --text-muted: #78716C;
  --accent: #B45309;
  --accent-soft: #FEF3C7;
  --border: #E7E5E4;
  --shadow: 0 1px 3px rgba(28,25,23,0.06), 0 4px 12px rgba(28,25,23,0.04);
  --shadow-hover: 0 4px 16px rgba(28,25,23,0.10);
  --radius: 14px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
header {
  background: rgba(255,255,255,0.82);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0.7rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  position: sticky;
  top: 0;
  z-index: 100;
}
header .icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(145deg, #FEF3C7, #FDE68A);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  box-shadow: var(--shadow);
}
header h1 {
  font-size: 1.15rem;
  font-weight: 650;
  letter-spacing: -0.02em;
  flex: 1;
  color: var(--text);
}
.btn {
  background: var(--text);
  color: #fff;
  border: none;
  padding: 0.55rem 1.05rem;
  border-radius: 980px;
  font-weight: 600;
  font-size: 0.875rem;
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}
.btn:active { transform: scale(0.96); opacity: 0.9; }
.btn:disabled { opacity: 0.4; transform: none; }
.btn-secondary {
  background: var(--surface2);
  color: var(--text);
  box-shadow: none;
}
.btn-secondary:active { background: #E7E5E4; }
main { max-width: 720px; margin: 0 auto; padding: 1.1rem 1rem 2rem; }
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.65rem;
  margin-bottom: 1.25rem;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.85rem 0.7rem;
  text-align: center;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.stat-card:active { transform: scale(0.98); }
.stat-card .label {
  font-size: 0.68rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 600;
}
.stat-card .value {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
  margin-top: 0.2rem;
  letter-spacing: -0.02em;
}
.stat-card .sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.1rem; }
.toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
.status { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; font-weight: 500; }
.article-list { display: flex; flex-direction: column; gap: 0.75rem; }
.article-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.05rem 1.15rem;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}
.article-card:active {
  transform: scale(0.985);
  box-shadow: var(--shadow-hover);
  border-color: #D6D3D1;
}
.article-card.read { opacity: 0.55; }
.article-card .meta {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 0.35rem;
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  align-items: center;
}
.article-card .title {
  font-size: 1.05rem;
  font-weight: 650;
  margin-bottom: 0.35rem;
  letter-spacing: -0.015em;
  color: var(--text);
  line-height: 1.35;
}
.article-card .excerpt {
  font-size: 0.875rem;
  color: var(--text-muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.45;
}
.badge {
  display: inline-block;
  background: var(--accent-soft);
  color: var(--accent);
  padding: 0.15rem 0.5rem;
  border-radius: 6px;
  font-size: 0.68rem;
  font-weight: 650;
  letter-spacing: 0.01em;
}
.reader {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.reader.active { display: block; }
.reader-header {
  background: rgba(255,255,255,0.85);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0.7rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  position: sticky;
  top: 0;
  z-index: 10;
}
.progress-bar {
  height: 3px;
  background: var(--surface2);
  position: sticky;
  top: 52px;
  z-index: 10;
}
.progress-bar .fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.12s ease;
  border-radius: 0 2px 2px 0;
}
.reader-content {
  max-width: 680px;
  margin: 0 auto;
  padding: 1.5rem 1.2rem 5rem;
}
.reader-content h1 {
  font-size: 1.55rem;
  font-weight: 700;
  margin-bottom: 0.45rem;
  line-height: 1.28;
  letter-spacing: -0.025em;
  color: var(--text);
}
.reader-content .byline {
  color: var(--text-muted);
  font-size: 0.875rem;
  margin-bottom: 1.5rem;
  font-weight: 500;
}
.reader-content .body {
  font-size: 1.08rem;
  line-height: 1.75;
  color: #292524;
  letter-spacing: -0.01em;
}
.reader-content .body p { margin-bottom: 1.1rem; }
.reader-content .body img {
  max-width: 100%;
  height: auto;
  border-radius: 12px;
  margin: 1.2rem 0;
  box-shadow: var(--shadow);
}
.reader-content a { color: var(--accent); text-decoration: none; font-weight: 500; }
.notes-area {
  margin-top: 2.2rem;
  border-top: 1px solid var(--border);
  padding-top: 1.2rem;
}
.notes-area label {
  display: block;
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-bottom: 0.4rem;
  font-weight: 600;
}
.notes-area textarea {
  width: 100%;
  min-height: 100px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 0.85rem 1rem;
  font-family: inherit;
  font-size: 0.95rem;
  resize: vertical;
  box-shadow: var(--shadow);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.notes-area textarea:focus {
  outline: none;
  border-color: #D6D3D1;
  box-shadow: 0 0 0 3px rgba(180,83,9,0.12);
}
.empty {
  text-align: center;
  padding: 3.5rem 1.5rem;
  color: var(--text-muted);
}
.empty p { margin-bottom: 0.6rem; font-size: 0.95rem; }
.empty strong { color: var(--text); }
  </style>
</head>

      <div class="stat-card">
        <div class="label">Week</div>
        <div class="value"><span id="statWeekArticles">0</span></div>
        <div class="sub"><span id="statWeekWords">0</span> words</div>
      </div>
      <div class="stat-card">
        <div class="label">Month</div>
        <div class="value"><span id="statMonthArticles">0</span></div>
        <div class="sub"><span id="statMonthWords">0</span> words</div>
      </div>
      <div class="stat-card">
        <div class="label">Year</div>
        <div class="value"><span id="statYearArticles">0</span></div>
        <div class="sub"><span id="statYearWords">0</span> words</div>
      </div>
    </div>
    <div class="toolbar">
      <span class="status" id="status">Ready</span>
      <span id="totalRead" style="font-size:0.8rem;color:var(--text-muted);font-weight:500;"></span>
    </div>
    <div id="articleList" class="article-list"></div>
  </main>

  <div id="reader" class="reader">
    <div class="reader-header">
      <button id="closeReader" class="btn btn-secondary">← Back</button>
      <button id="markReadBtn" class="btn">Mark Read</button>
    </div>
    <div class="progress-bar"><div id="progressFill" class="fill"></div></div>
    <div class="reader-content">
      <h1 id="readerTitle"></h1>
      <div class="byline" id="readerByline"></div>
      <div class="body" id="readerBody"></div>
      <div class="notes-area">
        <label for="readerNotes">Notes (autosaved)</label>
        <textarea id="readerNotes" placeholder="Type notes…"></textarea>
      </div>
    </div>
  </div>

<script>
const FEEDS=[
  {name:"Seymour Hersh",url:"https://seymourhersh.substack.com/feed"},
  {name:"Glenn Greenwald",url:"https://greenwald.substack.com/feed"},
  {name:"Matt Taibbi / Racket",url:"https://www.racket.news/feed"},
  {name:"Ken Klippenstein",url:"https://www.kenklippenstein.com/feed"},
  {name:"Drop Site News",url:"https://www.dropsitenews.com/feed"}
];
const CORS_PROXIES = [
  "https://api.allorigins.win/raw?url=",
  "https://corsproxy.io/?",
  "https://api.codetabs.com/v1/proxy?quest="
];
const DB_NAME="InvestigativeReaderSingle";
const DB_VERSION=1;
const STORE_ARTICLES="articles",STORE_PROGRESS="progress",STORE_STATS="stats";
let db=null,currentArticleId=null,scrollSaveTimer=null,readerStartedAt=null,maxScrollPct=0;
// Non-native English reading speed estimate (words per minute)
const WPM_NON_NATIVE = 140;

function openDB(){return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=e=>{
    const d=e.target.result;
    if(!d.objectStoreNames.contains(STORE_ARTICLES)){const s=d.createObjectStore(STORE_ARTICLES,{keyPath:"id"});s.createIndex("pubDate","pubDate");}
    if(!d.objectStoreNames.contains(STORE_PROGRESS))d.createObjectStore(STORE_PROGRESS,{keyPath:"id"});
    if(!d.objectStoreNames.contains(STORE_STATS))d.createObjectStore(STORE_STATS,{keyPath:"key"});
  };
  req.onsuccess=()=>{db=req.result;resolve(db)};
  req.onerror=()=>reject(req.error);
});}
function idbGet(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,"readonly");const r=tx.objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbPut(store,val){return new Promise((res,rej)=>{const tx=db.transaction(store,"readwrite");const r=tx.objectStore(store).put(val);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function idbGetAll(store){return new Promise((res,rej)=>{const tx=db.transaction(store,"readonly");const r=tx.objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}

function isFullFreeArticle(item){
  const content=(item.content||item.summary||"").replace(/<[^>]+>/g," ").trim();
  const lower=content.toLowerCase();
  const phrases=["this post is for paid subscribers","this post is for subscribers only","continue reading","upgrade to paid","become a paid subscriber","subscriber-only","paid subscribers only","read the full post","this is a paid post"];
  if(phrases.some(p=>lower.includes(p)))return false;
  if(content.length<300)return false;
  if(content.split(/\s+/).filter(Boolean).length<50)return false;
  return true;
}
function countWords(html){const t=(html||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();return t?t.split(" ").filter(Boolean).length:0;}

function parseRSS(xmlText,sourceName){
  const doc=new DOMParser().parseFromString(xmlText,"text/xml");
  const items=[...doc.querySelectorAll("item")];
  const articles=[];
  for(const item of items){
    const title=item.querySelector("title")?.textContent?.trim()||"Untitled";
    const link=item.querySelector("link")?.textContent?.trim()||item.querySelector("guid")?.textContent?.trim()||"";
    const pubDate=item.querySelector("pubDate")?.textContent||item.querySelector("published")?.textContent||new Date().toISOString();
    let content="";
    const enc=item.querySelector("content\\:encoded, encoded");
    content=enc?enc.textContent||"":(item.querySelector("description")?.textContent||item.querySelector("summary")?.textContent||"");
    const art={id:link||`${sourceName}-${title}-${pubDate}`,title,link,source:sourceName,pubDate:new Date(pubDate).toISOString(),content,wordCount:countWords(content),fetchedAt:new Date().toISOString()};
    if(isFullFreeArticle(art))articles.push(art);
  }
  return articles;
}

async function fetchFeed(feed){
  let lastError = null;
  for (const proxy of CORS_PROXIES) {
    try {
      const target = proxy + encodeURIComponent(feed.url);
      const res = await fetch(target, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      if (!text || text.length < 100) throw new Error("Empty response");
      return parseRSS(text, feed.name);
    } catch (err) {
      lastError = err;
      console.warn("Proxy failed for", feed.name, proxy, err.message);
    }
  }
  throw lastError || new Error("All proxies failed");
}

async function syncFeeds(){
  const btn=document.getElementById("syncBtn"),status=document.getElementById("status");
  btn.disabled=true;status.textContent="Syncing articles…";
  let totalNew=0;
  for(const feed of FEEDS){
    try{
      status.textContent="Fetching "+feed.name+"…";
      const articles=await fetchFeed(feed);
      for(const art of articles){
        const existing=await idbGet(STORE_ARTICLES,art.id);
        if(!existing){await idbPut(STORE_ARTICLES,art);totalNew++;}
        else if((art.content||"").length>(existing.content||"").length)await idbPut(STORE_ARTICLES,{...existing,...art});
      }
    }catch(err){console.warn(feed.name,err);status.textContent="Error on "+feed.name+" – continuing…";}
  }
  status.textContent=totalNew>0?`Added ${totalNew} articles`:"No new articles";
  btn.disabled=false;
  await renderList();await updateStatsDisplay();
}

async function saveProgress(id,data){const existing=(await idbGet(STORE_PROGRESS,id))||{id};await idbPut(STORE_PROGRESS,{...existing,...data,updatedAt:new Date().toISOString()});}
async function markRead(id,wordCount){
  const progress=(await idbGet(STORE_PROGRESS,id))||{id};
  if(progress.read)return;

  // Time spent (ms) – prefer live timer, fall back to stored
  const liveMs = readerStartedAt ? (Date.now()-readerStartedAt) : 0;
  const timeMs = Math.max(liveMs, progress.timeSpentMs||0);
  const scroll = Math.max(maxScrollPct, progress.maxScroll||progress.scrollPct||0);

  // Adjusted "effective words" for non-native speaker:
  // Combine actual word count with time-based estimate and scroll depth
  const words = wordCount || 0;
  const timeBasedWords = Math.round((timeMs/60000) * WPM_NON_NATIVE);
  // Weight: 50% declared words, 30% time spent, 20% how far they scrolled
  const effectiveWords = Math.round(
    words * 0.5 +
    timeBasedWords * 0.3 +
    words * (scroll/100) * 0.2
  );

  progress.read = true;
  progress.readAt = new Date().toISOString();
  progress.scrollPct = 100;
  progress.timeSpentMs = timeMs;
  progress.effectiveWords = effectiveWords;
  await idbPut(STORE_PROGRESS, progress);

  await addToStats(1, effectiveWords);
  await updateStatsDisplay();
}
async function addToStats(aDelta,wDelta){
  const now=new Date();
  const keys=[`day-${now.toISOString().slice(0,10)}`,`week-${getWeekKey(now)}`,`month-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`,`year-${now.getFullYear()}`,"all-time"];
  for(const key of keys){const row=(await idbGet(STORE_STATS,key))||{key,articles:0,words:0};row.articles+=aDelta;row.words+=wDelta;await idbPut(STORE_STATS,row);}
}
function getWeekKey(d){const date=new Date(d);date.setHours(0,0,0,0);date.setDate(date.getDate()+3-((date.getDay()+6)%7));const week1=new Date(date.getFullYear(),0,4);const weekNum=1+Math.round(((date-week1)/86400000-3+((week1.getDay()+6)%7))/7);return `${date.getFullYear()}-W${String(weekNum).padStart(2,"0")}`;}
async function updateStatsDisplay(){
  const now=new Date();
  const week=(await idbGet(STORE_STATS,`week-${getWeekKey(now)}`))||{articles:0,words:0};
  const month=(await idbGet(STORE_STATS,`month-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`))||{articles:0,words:0};
  const year=(await idbGet(STORE_STATS,`year-${now.getFullYear()}`))||{articles:0,words:0};
  const all=(await idbGet(STORE_STATS,"all-time"))||{articles:0,words:0};

  document.getElementById("statWeekArticles").textContent=week.articles;
  document.getElementById("statWeekWords").textContent=formatNumber(week.words);
  document.getElementById("statMonthArticles").textContent=month.articles;
  document.getElementById("statMonthWords").textContent=formatNumber(month.words);
  document.getElementById("statYearArticles").textContent=year.articles;
  document.getElementById("statYearWords").textContent=formatNumber(year.words);

  document.getElementById("statTotalArticles").textContent = all.articles;
  document.getElementById("statTotalWords").textContent = formatNumber(all.words);

  const totalEl=document.getElementById("totalRead");
  if(totalEl) totalEl.textContent = "";
}
function formatNumber(n){if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"k";return String(n);}

async function renderList(){
  const list=document.getElementById("articleList");
  const articles=await idbGetAll(STORE_ARTICLES);
  const progresses=await idbGetAll(STORE_PROGRESS);
  const progressMap=Object.fromEntries(progresses.map(p=>[p.id,p]));
  articles.sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate));
  if(!articles.length){list.innerHTML=`<div class="empty"><p>No articles cached yet.</p><p>Tap <strong>Sync</strong> while online.</p></div>`;return;}
  list.innerHTML=articles.map(art=>{
    const prog=progressMap[art.id]||{};
    const dateStr=new Date(art.pubDate).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
    const excerpt=(art.content||"").replace(/<[^>]+>/g," ").trim().slice(0,160);
    return `<div class="article-card ${prog.read?"read":""}" data-id="${escapeAttr(art.id)}">
      <div class="meta"><span class="badge">${escapeHtml(art.source)}</span><span>${dateStr}</span><span>${art.wordCount||"?"} words</span>${prog.read?"<span>✓ read</span>":""}</div>
      <div class="title">${escapeHtml(art.title)}</div>
      <div class="excerpt">${escapeHtml(excerpt)}…</div>
    </div>`;
  }).join("");
  list.querySelectorAll(".article-card").forEach(card=>card.addEventListener("click",()=>openReader(card.dataset.id)));
}
function escapeHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function escapeAttr(s){return escapeHtml(s).replace(/'/g,"&#39;");}

async function openReader(id){
  const art=await idbGet(STORE_ARTICLES,id);if(!art)return;
  currentArticleId=id;
  readerStartedAt = Date.now();
  maxScrollPct = 0;
  const prog=(await idbGet(STORE_PROGRESS,id))||{id,scrollPct:0,notes:"",timeSpentMs:0};
  document.getElementById("readerTitle").textContent=art.title;
  document.getElementById("readerByline").textContent=`${art.source} · ${new Date(art.pubDate).toLocaleDateString()} · ${art.wordCount} words`;
  document.getElementById("readerBody").innerHTML=art.content||"<p>(No content)</p>";
  document.getElementById("readerNotes").value=prog.notes||"";
  const reader=document.getElementById("reader");
  reader.classList.add("active");reader.scrollTop=0;
  requestAnimationFrame(()=>{if(prog.scrollPct>0&&prog.scrollPct<98){const max=reader.scrollHeight-reader.clientHeight;reader.scrollTop=(prog.scrollPct/100)*max;}});
  reader.onscroll=()=>{clearTimeout(scrollSaveTimer);scrollSaveTimer=setTimeout(async()=>{
    const max=reader.scrollHeight-reader.clientHeight;const pct=max>0?Math.round((reader.scrollTop/max)*100):0;
    if(pct>maxScrollPct) maxScrollPct=pct;
    const elapsed = readerStartedAt ? (Date.now()-readerStartedAt) : 0;
    await saveProgress(id,{scrollPct:pct,timeSpentMs:elapsed,maxScroll:maxScrollPct});
    document.getElementById("progressFill").style.width=pct+"%";
    if(pct>=90&&!(await idbGet(STORE_PROGRESS,id))?.read){await markRead(id,art.wordCount);document.getElementById("markReadBtn").textContent="✓ Read";}
  },400);};
  document.getElementById("progressFill").style.width=(prog.scrollPct||0)+"%";
  document.getElementById("markReadBtn").textContent=prog.read?"✓ Read":"Mark Read";
}
function closeReader(){
  if(currentArticleId){
    const elapsed = readerStartedAt ? (Date.now()-readerStartedAt) : 0;
    saveProgress(currentArticleId,{
      notes: document.getElementById("readerNotes").value,
      timeSpentMs: elapsed,
      maxScroll: maxScrollPct
    });
  }
  document.getElementById("reader").classList.remove("active");
  currentArticleId=null;
  readerStartedAt=null;
  renderList();
}
async function handleMarkRead(){if(!currentArticleId)return;const art=await idbGet(STORE_ARTICLES,currentArticleId);await markRead(currentArticleId,art?.wordCount||0);document.getElementById("markReadBtn").textContent="✓ Read";}

async function init(){
  await openDB();
  await renderList();
  await updateStatsDisplay();

  document.getElementById("syncBtn").addEventListener("click",syncFeeds);
  document.getElementById("closeReader").addEventListener("click",closeReader);
  document.getElementById("markReadBtn").addEventListener("click",handleMarkRead);
  document.getElementById("readerNotes").addEventListener("input",()=>{
    if(currentArticleId){
      clearTimeout(window._notesTimer);
      window._notesTimer=setTimeout(()=>saveProgress(currentArticleId,{
        notes:document.getElementById("readerNotes").value
      }),600);
    }
  });

  // Auto-sync when online
  if (navigator.onLine) {
    document.getElementById("status").textContent = "Syncing…";
    try {
      await syncFeeds();
    } catch (e) {
      document.getElementById("status").textContent = "Auto-sync failed · tap Sync";
    }
  } else {
    document.getElementById("status").textContent = "Offline · showing cached articles";
  }

  // Also re-sync when connection returns
  window.addEventListener("online", () => {
    document.getElementById("status").textContent = "Back online · syncing…";
    syncFeeds();
  });
}
document.addEventListener("DOMContentLoaded",init);


// ========== Offline caching (Service Worker) ==========
if ("serviceWorker" in navigator) {
  const swCode = `
    const CACHE = "inv-reader-v2";
    self.addEventListener("install", (event) => {
      event.waitUntil(
        caches.open(CACHE).then((cache) => {
          return cache.addAll([self.registration.scope, self.registration.scope + "index.html"].filter(Boolean)).catch(() => {});
        })
      );
      self.skipWaiting();
    });
    self.addEventListener("activate", (event) => {
      event.waitUntil(
        caches.keys().then((keys) =>
          Promise.all(keys.filter((k) => k !== CACHE).map((k) => caches.delete(k)))
        )
      );
      self.clients.claim();
    });
    self.addEventListener("fetch", (event) => {
      const url = new URL(event.request.url);
      // Never cache the CORS proxy / external feeds
      if (url.hostname.includes("allorigins") || url.pathname.includes("/feed") || url.hostname.includes("substack") || url.hostname.includes("racket") || url.hostname.includes("dropsite") || url.hostname.includes("kenklippenstein")) {
        event.respondWith(fetch(event.request).catch(() => new Response("Offline", { status: 503 })));
        return;
      }
      // App shell + same-origin: cache first
      event.respondWith(
        caches.match(event.request).then((cached) => {
          if (cached) return cached;
          return fetch(event.request).then((response) => {
            if (response && response.ok && url.origin === self.location.origin) {
              const clone = response.clone();
              caches.open(CACHE).then((cache) => cache.put(event.request, clone));
            }
            return response;
          }).catch(() => cached || new Response("You are offline", { status: 503, headers: { "Content-Type": "text/plain" } }));
        })
      );
    });
  `;
  try {
    const blob = new Blob([swCode], { type: "application/javascript" });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).then(() => {
      console.log("Service Worker registered – offline caching active");
    }).catch((err) => {
      console.warn("SW registration failed (still works via IndexedDB):", err);
    });
  } catch (e) {
    console.warn("Could not register Service Worker:", e);
  }
}

</script>
</body>
